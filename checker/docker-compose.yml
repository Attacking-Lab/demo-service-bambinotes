name: bambinotes-checker

services:
  bambinotes-checker:
    container_name: bambinotes-checker
    build:
      context: .
      secrets:
        - checker-pull-token
    ports:
      - ${CHECKER_PORT:-8000}:${CHECKER_PORT:-8000}
    environment:
      - CHECKER_PORT=${CHECKER_PORT:-8000}
      - SERVICE_PORT=${SERVICE_PORT:-9000}
      - MONGO_ENABLED=1
      - MONGO_HOST=bambinotes-mongo
      - MONGO_PORT=27017
      - MONGO_USER=bambinotes
      - MONGO_PASSWORD=bambinotes
    restart: unless-stopped
    depends_on:
      bambinotes-mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/service')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  bambinotes-mongo:
    container_name: bambinotes-mongo
    image: mongo
    volumes:
      - ./data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: bambinotes
      MONGO_INITDB_ROOT_PASSWORD: bambinotes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

secrets:
  checker-pull-token:
    environment: CHECKER_PULL_TOKEN

networks:
  default:
    name: bambinotes-checker
